<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>addr2me</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #e2e8f0;
            padding: 1rem;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.5rem;
        }

        .repo-link {
            display: inline-flex;
            color: #475569;
            text-decoration: none;
            transition: color 0.15s;
            margin-right: 1.5rem;
        }

        .repo-link:hover {
            color: #94a3b8;
        }

        .card {
            text-align: center;
            padding: 2rem 3rem;
            background: #1e293b;
            border-radius: 1.5rem;
            border: 1px solid #334155;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            min-width: 0;
        }

        .label {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #64748b;
            margin-bottom: 0.75rem;
        }

        .ip-row {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .ip {
            font-size: clamp(1.6rem, 6vw, 3rem);
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #38bdf8;
            font-family: 'Courier New', monospace;
            word-break: break-all;
        }

        .time {
            font-size: 0.9rem;
            color: #64748b;
            font-family: 'Courier New', monospace;
            margin-bottom: 1.25rem;
        }

        .flag {
            font-size: 2.5rem;
            margin-bottom: 0.4rem;
        }

        .geo-row {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }

        .geo {
            font-size: 0.85rem;
            color: #94a3b8;
            line-height: 1.6;
        }

        .copy-btn {
            cursor: pointer;
            background: none;
            border: none;
            padding: 0.25rem;
            color: #475569;
            border-radius: 0.375rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s, background 0.15s;
            flex-shrink: 0;
        }

        .copy-btn:hover {
            color: #94a3b8;
            background: #334155;
        }

        .copy-btn.done {
            color: #4ade80;
        }

        .divider {
            border: none;
            border-top: 1px solid #334155;
            margin: 1.25rem 0;
        }

        .copy-all-btn {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1.25rem;
            background: #0ea5e9;
            border: 1px solid transparent;
            border-radius: 0.5rem;
            color: #fff;
            font-size: 0.8rem;
            font-family: inherit;
            font-weight: 600;
            transition: color 0.15s, border-color 0.15s, background 0.15s;
            margin-bottom: 1.25rem;
        }

        .copy-all-btn:hover {
            background: #0284c7;
        }

        .copy-all-btn.done {
            background: none;
            color: #4ade80;
            border-color: #4ade80;
        }

        .api-hints {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .api-hint {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.78rem;
            color: #475569;
        }

        .api-hint code {
            background: #0f172a;
            padding: 0.2rem 0.4rem;
            border-radius: 0.25rem;
            color: #94a3b8;
            word-break: break-all;
        }

        @media (max-width: 480px) {
            .card {
                padding: 1.5rem;
                width: 100%;
            }

            .time {
                font-size: 0.78rem;
            }

            .api-hint {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <a class="repo-link" href="https://github.com/k0st1an/addr2me" target="_blank" rel="noopener" title="k0st1an/addr2me on GitHub">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
            </svg>
        </a>
        <div class="card">
            <div class="label">Your IP address</div>
            <div class="ip-row">
                <span class="ip" id="ip">{{.IP}}</span>
                <button class="copy-btn" id="copy-ip" onclick="copyText('ip', 'copy-ip')" title="Copy IP">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                    </svg>
                </button>
            </div>
            <div class="time">{{.Time}} UTC</div>
            {{if .HasGeo}}
            <div class="flag">{{.Flag}}</div>
            <div class="geo-row">
                <span class="geo" id="geo">{{.Country}} ({{.CountryCode}}), {{.Continent}} ({{.ContinentCode}}), {{.ASName}} ({{.ASN}})</span>
                <button class="copy-btn" id="copy-geo" onclick="copyText('geo', 'copy-geo')" title="Copy geo info">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                    </svg>
                </button>
            </div>
            {{end}}
            <hr class="divider">
            {{if .HasGeo}}
            <button class="copy-all-btn" id="copy-all" onclick="copyAll()">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
                Copy all
            </button>
            {{end}}
            <div class="api-hints">
                <div class="api-hint">
                    <code id="curl-plain">curl -s https://{{.Host}}/</code>
                    <button class="copy-btn" id="copy-curl-plain" onclick="copyText('curl-plain', 'copy-curl-plain')" title="Copy">
                        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                        </svg>
                    </button>
                </div>
                <div class="api-hint">
                    <code id="curl-json">curl -s https://{{.Host}}/json</code>
                    <button class="copy-btn" id="copy-curl-json" onclick="copyText('curl-json', 'copy-curl-json')" title="Copy">
                        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const svgs = {
            copy: {
                22: `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`,
                16: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`,
                13: `<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`,
            },
            check: {
                22: `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
                16: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
                13: `<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
            },
        };

        const btnSize = {
            'copy-ip': 22, 'copy-geo': 16, 'copy-curl-plain': 13, 'copy-curl-json': 13,
        };

        function copyAll() {
            const parts = [document.getElementById('ip').textContent.trim()];
            const geo = document.getElementById('geo');
            if (geo) parts.push(geo.textContent.trim());
            const btn = document.getElementById('copy-all');
            navigator.clipboard.writeText(parts.join('\n')).then(() => {
                btn.classList.add('done');
                btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Copied!`;
                setTimeout(() => {
                    btn.classList.remove('done');
                    btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy all`;
                }, 2000);
            });
        }

        function copyText(textId, btnId) {
            const text = document.getElementById(textId).textContent.trim();
            const btn = document.getElementById(btnId);
            const sz = btnSize[btnId] || 16;
            navigator.clipboard.writeText(text).then(() => {
                btn.classList.add('done');
                btn.innerHTML = svgs.check[sz];
                setTimeout(() => {
                    btn.classList.remove('done');
                    btn.innerHTML = svgs.copy[sz];
                }, 2000);
            });
        }
    </script>
</body>
</html>
